<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chárraiá da Olivia 🎉</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #fff8f0;
      padding: 20px;
    }

    h1 { color: #d35400; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
      gap: 10px;
      max-width: 600px;
      margin: auto;
    }

    .numero {
      padding: 15px;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .disponivel { background: #2ecc71; }
    .vendido { background: #e74c3c; cursor: not-allowed; }

    button {
      margin: 10px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #d35400;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Chárraiá da Olivia 🎉</h1>

<button onclick="ativarAdmin()">Modo Admin</button>

<div id="grid" class="grid"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore,
    doc,
    setDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "SUA_KEY",
    authDomain: "SEU_DOMINIO",
    projectId: "SEU_ID",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let admin = false;
  const senha = "1234";

  const ref = doc(db, "rifa", "numeros");

  function criarGrid(vendidos) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    for (let i = 1; i <= 100; i++) {
      const div = document.createElement("div");
      div.classList.add("numero");

      const registro = vendidos.find(n => n.numero === i);

      if (registro) {
        div.classList.add("vendido");
        div.title = "Comprado por: " + registro.nome;
      } else {
        div.classList.add("disponivel");
      }

      div.innerText = i;

      div.onclick = async () => {
        const registroAtual = vendidos.find(n => n.numero === i);

        // 👀 usuário comum
        if (!admin) {
          if (registroAtual) {
            alert(`Número ${i} já foi comprado por ${registroAtual.nome}`);
          } else {
            alert("Número disponível!");
          }
          return;
        }

        // 🔧 admin
        let novos = [...vendidos];
        const index = novos.findIndex(n => n.numero === i);

        if (index !== -1) {
          if (confirm("Remover este número?")) {
            novos.splice(index, 1);
          }
        } else {
          const nome = prompt("Nome de quem comprou:");
          if (!nome) return;
          novos.push({ numero: i, nome });
        }

        await setDoc(ref, { vendidos: novos });
      };

      grid.appendChild(div);
    }
  }

  // 🔐 ADMIN GLOBAL
  window.ativarAdmin = function () {
    const tentativa = prompt("Senha:");
    if (tentativa === senha) {
      admin = true;
      alert("Admin ativado");
    } else {
      alert("Senha incorreta");
    }
  };

  // 🔥 TEMPO REAL
  onSnapshot(ref, (docSnap) => {
    let vendidos = [];

    if (docSnap.exists()) {
      vendidos = docSnap.data().vendidos || [];
    }

    criarGrid(vendidos);
  });

</script>

</body>
</html>
